services:
  subjectivity-classifier:
    platform: linux/amd64
    build:
      context: ./services/subjectivity_classifier
    environment:
      SUBJECTIVITY_WORD_EMBEDDINGS_PATH: /external_model/glove.6B.50d.txt
    volumes:
      - ./services/subjectivity_classifier/model:/external_model:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
